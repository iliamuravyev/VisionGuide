<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/main.css">
    <title>Vision Guide</title>
</head>
<body>
    <header class="header">
        <button class="menu-btn" aria-label="Меню">
            <img src="/images/Menu.png" class="menu-btn-img" id="menu-icon">
        </button>
        <div class="logo-container">
            <img src="/images/logo.png" alt="Логотип" class="logo">
        </div>
    </header>

    <main class="main-content">
        <label class="upload-btn" id="upload-widget">
            <input type="file" accept="image/*" class="file-input" id="image-loader">
            <div class="upload-header-row">
                <span class="upload-text">Загрузите изображение</span>
                <form method="POST">
                    <button class="upload-action-btn">Отправить &rarr;</button>
                </form>
                <span class="plus-icon"></span>
            </div>
        </label>

        <div class="modal-overlay" id="confirm-modal">
            <div class="modal-box">
                <p class="modal-title">Убрать изображение?</p>
                <div class="modal-buttons">
                    <button class="modal-btn btn-confirm" id="modal-yes">Да</button>
                    <button class="modal-btn btn-cancel" id="modal-no">Нет</button>
                </div>
            </div>
        </div>
    </main>

    <div class="side-menu" id="side-menu">
        <div class="side-menu-header">
            <span class="side-menu-title">Меню</span>
            <button class="close-btn" id="close-menu-btn" aria-label="Закрыть меню">&times;</button>
        </div>
        <nav class="side-menu-links">
            <a href="#" class="side-menu-item">что-то</a>
            <a href="#" class="side-menu-item">что-то</a>
            <a href="index.html" class="side-menu-item">Выход</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menu-overlay"></div>

    <script src="/scripts/imageUploader.js" defer></script>
    <script src="/scripts/sideMenuController.js"></script>
</body>
</html>
